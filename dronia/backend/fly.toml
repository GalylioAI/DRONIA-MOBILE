# fly.toml app configuration file generated for dronia-backend-white-flower-1546 on 2025-12-20T11:59:14+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dronia-backend-white-flower-1546'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_HOST = '0.0.0.0'
  API_PORT = '8080'
  PORT = '8080'

[processes]
  app = 'uvicorn api.main:app --host 0.0.0.0 --port 8080'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

# Auto-stop machines when idle to save resources (free tier)
[http_service]
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
